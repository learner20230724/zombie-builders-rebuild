<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>建筑工大战僵尸 · Zombie Trailer Park</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/settings-ui.css">
  <link rel="stylesheet" href="/src/time-controls.css">
  <style>
    :root{--viewport-height:100vh}
    @supports(height:100dvh){:root{--viewport-height:100dvh}}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ddd;font:14px system-ui,sans-serif}
    main{position:fixed;inset:0;display:grid;place-items:center;container-type:size;min-width:0;min-height:0}
    canvas{display:block;width:min(100vw,calc(var(--viewport-height) * 4 / 3));height:min(var(--viewport-height),calc(100vw * 3 / 4));aspect-ratio:4/3;background:#000;outline:none;touch-action:none}
    @supports(width:1cqw){canvas{width:min(100cqw,calc(100cqh * 4 / 3));height:min(100cqh,calc(100cqw * 3 / 4))}}
    #status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:max-content;max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;margin:0;padding:12px 16px;border-radius:6px;background:#222e;line-height:1.6;pointer-events:none}
    #status:empty{display:none}
    #status.error{color:#ffb4a9;white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="800" height="600" tabindex="0" aria-label="建筑工大战僵尸游戏画面，使用鼠标选择关卡、招募单位、建造建筑和释放技能"></canvas>
    <div id="status" role="status">正在加载本机游戏资源……</div>
  </main>
  <script src="/public/vendor/box2dweb.js"></script>
  <script src="/src/physics.js"></script>
  <script src="/src/runtime.js"></script>
  <script src="/src/generated-game.js"></script>
  <script src="/src/game-config.js"></script>
  <script src="/src/custom-rules.js"></script>
  <script src="/src/factions.js"></script>
  <script src="/src/death-effects.js"></script>
  <script src="/src/spawn-queue.js"></script>
  <script src="/src/customization.js"></script>
  <script src="/src/settings-ui.js"></script>
  <script src="/src/time-controls.js"></script>
  <script src="/src/boot.js"></script>
</body>
</html>
